name: API security experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate && npm test
      - name: Prepare pinned local laboratory
        run: npm run lab:setup
      - name: Run collection and preserve outcome
        id: experiment
        shell: bash
        run: |
          set +e
          npm run lab:run
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 2 ]; then exit 2; fi
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-evidence-${{ github.run_id }}
          path: results/runs/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop laboratory
        if: always()
        run: npm run lab:down
